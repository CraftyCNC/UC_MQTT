esphome:
  name: dust-collector
  friendly_name: Dust Collector

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "Your Key"

ota:
  - platform: esphome
    password: "Your Password"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dust-Collector Fallback Hotspot"
    password: "Your password"

captive_portal:
    


mqtt:
  broker: "Your Broker IP address"
  port: 1883
  username: ""
  password: ""
  birth_message:
  will_message:
  discovery: False
  discovery_retain: False
  #client_id: propanemonitor
  #topic_prefix: propanemonitor
  on_message:
    - topic: DustCollector
      payload: 'ON'
      then:
        - logger.log: 'Start'
        - switch.turn_on: start_switch
    - topic: DustCollector
      payload: 'OFF'
      then:
        - logger.log: 'Stop'
        - switch.turn_on: stop_switch





web_server:
  port: 80
bluetooth_proxy:
  active: true
time:
  - platform: homeassistant
    id: homeassistant_time
binary_sensor:
  - platform: status
    name: "Status"
  - platform: gpio
    name: "Boot Button"
    pin:
      number: 0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    disabled_by_default: true
    on_press:
      then:
        - button.press: restart_button

sensor:
  # Example configuration entry with 2 sensors and filter
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db_house
    update_interval: 60s
    entity_category: "diagnostic"
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db_house
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

    # LED exposed as binary light
output:
  - platform: gpio
    pin: GPIO23
    id: output_led

  - platform: gpio
    pin: GPIO16
    id: start_relay
    #name: start_relay

  - platform: gpio
    pin: GPIO17
    id: stop_relay
    #name: stop_relay


light:
  - platform: binary
    id: light_led
    name: LED
    output: output_led

interval:
  - interval: 1s
    then:
         - output.turn_on: output_led
         - delay: 500ms
         - output.turn_off: output_led


# Relays exposed as switches
switch:
- platform: template
  name: "Start"
  id: start_switch
  turn_on_action:
    - output.turn_on: start_relay
    - delay: 2s
    - output.turn_off: start_relay
    - switch.turn_off: start_switch
  turn_off_action:
    - output.turn_off: start_relay
- platform: template
  name: "Stop"
  id: stop_switch
  turn_on_action:

    - output.turn_on: stop_relay
    - delay: 2s
    - output.turn_off: stop_relay
    - switch.turn_off: stop_switch
  turn_off_action:
    - output.turn_off: stop_relay


